name: gates
on: [push, pull_request]

jobs:
  python-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check_manifest
        run: python3 groundtruth/check_manifest.py
      - name: check_twin_fp
        run: python3 tools/check_twin_fp.py
      - name: sync_pages
        run: python3 tools/sync_pages.py
      - name: coverage audit (sdk manifest fixture)
        run: |
          # CI 无 DevEco SDK：用 tools/sdk_manifest.json 清单快照跑覆盖对账 + 漂移门禁
          # （本地以真实 SDK 跑同名命令；快照漂移时本地 --dump-fixture 重新生成）。
          # 组件内 API 对账（check_component_api_coverage.py）依赖 SDK d.ts，保持本地执行。
          python3 tools/check_corpus_coverage.py --use-fixture | tee /tmp/cov.txt
          grep -q '漂移检查 OK' /tmp/cov.txt
      - name: generator determinism (all)
        run: |
          # 全部纯源码生成器原地重生成，git diff --exit-code 验证与提交内容一致。
          # gen_rawfile_abc 依赖 SDK 工具链（es2abc），保持本地执行、不进 CI。
          for gen in tools/gen_string_stress.py tools/gen_lexwide_stress.py \
                     tools/gen_sendable_stress.py tools/gen_wide_stress.py \
                     tools/gen_stown_stress.py tools/gen_methname_stress.py \
                     tools/gen_recursion_stress.py tools/gen_vulns_overview.py \
                     tools/gen_heavy_farm.py; do
            echo "--- $gen ---"
            python3 "$gen"
          done
          git diff --exit-code
      - name: python syntax check
        run: |
          find . -name '*.py' -not -path './oh_modules/*' -not -path './.hvigor/*' \
            | xargs -I{} python3 -m py_compile {}
      - name: manifest entry count
        run: |
          python3 -c "
          import json
          m = json.load(open('groundtruth/manifest.json'))
          n = len(m['vulns'])
          twins = sum(1 for e in m['vulns'] if not e.get('expected', True))
          vulns = n - twins
          print(f'manifest: {n} entries (vuln={vulns}, twin={twins})')
          assert vulns == twins, f'vuln({vulns}) != twin({twins})'
          assert n >= 120, f'manifest shrank below 120: {n}'
          "
