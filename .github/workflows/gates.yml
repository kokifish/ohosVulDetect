name: gates
on: [push, pull_request]

jobs:
  python-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check_manifest
        run: python3 groundtruth/check_manifest.py
      - name: sync_pages
        run: python3 tools/sync_pages.py
      - name: generator determinism (string_stress)
        run: |
          python3 tools/gen_string_stress.py --outdir /tmp/gencheck
          diff /tmp/gencheck/StringStressLab.ts feat_api/src/main/ets/pages/lang/StringStressLab.ts
      - name: generator determinism (all generators)
        run: |
          for gen in tools/gen_*.py; do
            echo "--- $gen ---"
            # 逐个生成器跑 dry-run（如有 --outdir 参数则输出到 /tmp 再 diff）
            case "$gen" in
              */gen_string_stress.py)
                python3 "$gen" --outdir /tmp/gencheck_all
                diff -r /tmp/gencheck_all feat_api/src/main/ets/pages/lang/ --exclude='*.ets' 2>/dev/null || true
                ;;
              *)
                echo "(no determinism check configured)"
                ;;
            esac
          done
      - name: python syntax check
        run: |
          find . -name '*.py' -not -path './oh_modules/*' -not -path './.hvigor/*' \
            | xargs -I{} python3 -m py_compile {}
      - name: manifest entry count
        run: |
          python3 -c "
          import json
          m = json.load(open('groundtruth/manifest.json'))
          n = len(m['vulns'])
          twins = sum(1 for e in m['vulns'] if not e.get('expected', True))
          vulns = n - twins
          print(f'manifest: {n} entries (vuln={vulns}, twin={twins})')
          assert vulns == twins, f'vuln({vulns}) != twin({twins})'
          assert n >= 120, f'manifest shrank below 120: {n}'
          "
